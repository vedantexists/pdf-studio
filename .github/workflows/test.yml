name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (QPDF)
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Install Python verification tools
        run: pip install pypdf pypdfium2 reportlab pillow

      - name: Install Node dependencies
        run: npm install

      - name: Print environment info
        run: |
          echo "=== CI Runner Environment ==="
          node --version
          npm --version
          python --version
          qpdf --version | head -n 1

      - name: Run full test suite
        run: npm test
