name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (QPDF)
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Install Python verification tools
        run: pip install pypdf pypdfium2 reportlab pillow

      - name: Install Node dependencies
        run: npm install

      - name: Run full test suite
        run: npm test
